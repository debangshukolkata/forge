[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "Local, Windows-first coding agent that works in per-requirement workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Runtime dependencies are added milestone by milestone (DECISIONS D-020).
dependencies = [
    "openai>=1.60",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "psutil>=5.9",
    "pathspec>=0.12",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pillow>=10",
    "pypdfium2>=4",
    "truststore>=0.9",  # MIT, pure Python: trust the Windows certificate store (company TLS inspection, D-110)
]

[project.optional-dependencies]
# Optional features; each degrades with a `forge doctor` message when missing (D-098).
browser = ["playwright>=1.45"]  # browser_open / screenshots (Apache-2.0)
mcp = ["mcp>=2.0"]  # MCP client (MIT)
webtext = ["trafilatura>=1.12"]  # cleaner Markdown from web pages for web_fetch (Apache-2.0); optional, D-209
slides = ["python-pptx>=1.0"]  # build_presentation: real .pptx files (MIT), D-240
docs = ["openpyxl>=3.1", "python-docx>=1.1", "pypdf>=4.0", "reportlab>=4.0"]  # Excel, Word and PDF files (MIT/MIT/BSD/BSD), D-275; charts read .xlsx with openpyxl
audit = ["pip-audit>=2.7"]  # second vulnerability source for the Dependencies section (Apache-2.0), D-238
intel = ["jedi>=0.19"]  # find_definition / find_references / list_symbols for Python (MIT, pure Python; pulls in parso, MIT)
gemini = ["google-genai>=1.0"]  # Gemini on Vertex AI (Apache-2.0); auth is ADC, D-150
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",  # parallel test runs: pytest -n 8 --dist loadfile (MIT, dev only)
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "playwright>=1.45",
    "types-psutil",
    "openpyxl>=3.1",  # the Excel chart-data test
]

[project.scripts]
forge = "forge.cli:main"
debcraft = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge = ["py.typed", "data/tiktoken/*", "data/icons/*", "data/illustrations/*/*", "defaults/*.yaml", "agent/prompts/*.md", "workflow/prompts/*.md", "context/prompts/*.md", "skills/*/SKILL.md", "skills/*/*/*", "skills/*/*/*/*", "skills/*/*/*/*/*", "skills/*/*/*/*/*/*", "modeb/forge_structure_export.py", "vision/static/*", "web/react/*", "web/react/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fixture repo has its own tests, run by its own interpreter (tests/test_fixture_repo.py).
# benchmarks/tasks hold the hidden tests of the coding benchmark; tests/test_benchmark_fixtures.py runs them on purpose.
norecursedirs = ["fixtures", "benchmarks", ".venv", "venv"]
addopts = "-ra --strict-markers -m \"not live\""
asyncio_mode = "auto"
# Live runs take many minutes; keep their tmp dirs even if other pytest sessions run meanwhile.
tmp_path_retention_count = 25
markers = [
    "live: calls the real Azure OpenAI deployment (needs AZURE_OPENAI_* in .env)",
    "pg: needs the local Postgres (LOCAL_PG_URL in .env)",
    "e2e: Playwright end-to-end tests of the web UI in headless Edge",
    "browser: drives headless Edge (added by tests/conftest.py to every module that uses playwright or the Vite harness); the fast run is -m \"not browser and not live\"",
    "fixture: runs the fixture repo's own test suite (needs its venv)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures", ".venv314", "test-artifacts", "scripts/campaign", "tests/benchmarks/tasks", "tests/benchmarks/challenges/*/seed", "tests/benchmarks/overnight/*/seed"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The rename to DebCraft (3 characters longer) pushed prose in strings and comments just past 110; the formatter still
# wraps code, so only the line-length lint is relaxed (D-244).
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Embedded scripts that run in the app's venv keep their natural line lengths.
"src/forge/diagnose/openapi_probe.py" = ["E501"]
"tests/test_m10_tools.py" = ["E501"]  # a recorded HTML page
"tests/test_modeb.py" = ["E501"]  # inline source files
"tests/test_live_modeb.py" = ["E501"]  # inline profile text
"tests/test_live_learning.py" = ["E501"]
"tests/test_parity.py" = ["E501"]
"src/forge/vision/metrics.py" = ["E501"]
"tests/test_file_control_characters.py" = ["RUF001"]  # en dashes and curly quotes are the subject
"tests/test_pdf_scripts*.py" = ["RUF001"]  # the strings are Greek, Cyrillic and Indic text on purpose
"scripts/dev/app_screens/*" = ["E501", "RUF001"]  # screen markup is data: long lines and typographic signs (×, –) are content
"src/forge/vision/synthetic.py" = ["E501"]
"src/forge/vision/evals.py" = ["E501"]
"src/forge/tools/vision.py" = ["E501"]
"tests/test_hardening.py" = ["E501"]  # one secret fixture per line
"tests/test_web_e2e.py" = ["E501"]  # scripted event payloads
"tests/test_live_web_react.py" = ["E501"]  # requirement text
"tests/test_live_web_e2e.py" = ["E501"]
"src/forge/safety/injection.py" = ["E501"]
"tests/test_vision.py" = ["E501"]
"tests/test_live_vision.py" = ["E501"]
"src/forge/modeb/forge_structure_export.py" = ["E501"]  # standalone script the user runs on the host

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/forge"]

[[tool.mypy.overrides]]
# A standalone stdlib script users run on the host machine (Mode B); it is not imported by Forge.
module = "forge.modeb.forge_structure_export"
ignore_errors = true

[[tool.mypy.overrides]]
# No type stubs are published for these.
module = ["pypdfium2", "pypdfium2.*", "openpyxl", "openpyxl.*", "reportlab", "reportlab.*", "jedi", "jedi.*"]
ignore_missing_imports = true
